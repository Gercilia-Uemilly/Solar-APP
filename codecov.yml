coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 5%
ignore:
  - "src/components/ui/**"
  - "src/integrations/supabase/types.ts"
  - "supabase/functions/**"
  - "e2e/**"
comment:
  layout: "reach, diff, flags, files"
  behavior: default